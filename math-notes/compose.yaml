services:
  math-notes:
    build: .
    image: math-notes:local
    container_name: math-notes
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MATH_NOTES_DB_PATH: /app/data/math-notes.db
      MATH_NOTES_PLOTS_DIR: /app/data/assets/plots
      MPLCONFIGDIR: /app/data/.matplotlib
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET}
    volumes:
      - ./data:/app/data
    networks:
      - edge

networks:
  edge:
    external: true
