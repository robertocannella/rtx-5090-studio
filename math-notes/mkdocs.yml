site_name: Math Notes
site_description: Math notes, derivations, and worked word problems, with real LaTeX.
site_url: https://math.example.com/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Blog: blog/index.md
  - LaTeX Guide: latex-guide.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      categories: true
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      # The Docker build context here is just this app's own files, not a git checkout,
      # so the plugin's git-history fallback for dates never has anything to find --
      # frontmatter (date_from_meta above) already covers every post unconditionally.
      use_git: false

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
