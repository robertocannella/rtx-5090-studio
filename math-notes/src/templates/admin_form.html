{% extends "admin_base.html" %}
{% block admin_content %}
<form class="admin-form" method="post" action="{{ action }}">
  <label>Title
    <input type="text" name="title" value="{{ post.title if post else '' }}" required>
  </label>
  <label>Category
    <input type="text" name="category" value="{{ post.category if post else '' }}" required>
  </label>
  {% if not post %}
    <label>Slug (optional -- derived from the title if left blank)
      <input type="text" name="slug" value="">
    </label>
  {% endif %}

  <div class="admin-blocks" id="admin-blocks">
    {% for seg in segments %}
      <div class="admin-block" data-mode="{{ 'view' if seg.view_html else 'edit' }}">
        <div class="admin-block__header">
          <span class="admin-block__label">{{ seg.label }}</span>
          <div class="admin-block__controls">
            <button type="button" class="admin-block__generate-graph"{% if seg.label != 'Matplotlib graph' %} hidden{% endif %}>Generate graph</button>
            <button type="button" class="admin-block__toggle">{{ 'Edit' if seg.view_html else 'Done' }}</button>
            <button type="button" class="admin-block__move-up" title="Move block up">&uarr;</button>
            <button type="button" class="admin-block__move-down" title="Move block down">&darr;</button>
            <button type="button" class="admin-block__delete" title="Delete block">&times;</button>
          </div>
        </div>
        <div class="admin-block__view md-typeset">{{ seg.view_html | safe }}</div>
        <textarea name="segments" rows="{{ seg.rows }}">{{ seg.text }}</textarea>
      </div>
    {% endfor %}
  </div>

  <button type="button" id="admin-add-block" class="md-button">+ Add block</button>

  <div class="admin-actions">
    <button type="submit" class="md-button md-button--primary">Save</button>
    <a href="/admin/">Cancel</a>
  </div>
</form>

<template id="admin-block-template">
  <div class="admin-block" data-mode="edit">
    <div class="admin-block__header">
      <span class="admin-block__label">Paragraph</span>
      <div class="admin-block__controls">
        <button type="button" class="admin-block__generate-graph" hidden>Generate graph</button>
        <button type="button" class="admin-block__toggle">Done</button>
        <button type="button" class="admin-block__move-up" title="Move block up">&uarr;</button>
        <button type="button" class="admin-block__move-down" title="Move block down">&darr;</button>
        <button type="button" class="admin-block__delete" title="Delete block">&times;</button>
      </div>
    </div>
    <div class="admin-block__view md-typeset"></div>
    <textarea name="segments" rows="4"></textarea>
  </div>
</template>

<script src="/javascripts/admin-blocks.js"></script>
{% endblock %}
