{% extends "admin_base.html" %}
{% block content %}
<p><a class="md-button" href="/admin/new">New post</a></p>
<table>
  <thead>
    <tr><th>Title</th><th>Category</th><th>Slug</th><th>Updated</th><th></th></tr>
  </thead>
  <tbody>
    {% for post in posts %}
      <tr>
        <td><a href="/blog/{{ post.slug }}/">{{ post.title }}</a></td>
        <td>{{ post.category }}</td>
        <td>{{ post.slug }}</td>
        <td>{{ post.updated_at[:10] }}</td>
        <td class="admin-row-actions">
          <a href="/admin/{{ post.id }}/edit">Edit</a>
          <form method="post" action="/admin/{{ post.id }}/delete" onsubmit="return confirm('Delete this post?')">
            <button type="submit" class="md-button">Delete</button>
          </form>
        </td>
      </tr>
    {% else %}
      <tr><td colspan="5">No posts yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
