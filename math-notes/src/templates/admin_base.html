{% extends "base.html" %}
{% block article %}
<style>
  .admin-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; }
  .admin-header a { font-size: 0.85rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--md-default-fg-color--lightest); }
  /* 61rem matches Material's own .md-grid max-width (the site's actual content-column
     convention elsewhere) rather than an arbitrary number -- was a much narrower 700px
     (43.75rem), cramped for a block's textarea (a matplotlib code block especially,
     where lines wrap far sooner than they need to). Each block's own textarea is
     `width: 100%`, so this one change widens every block at once. */
  form.admin-form { display: flex; flex-direction: column; gap: 1rem; max-width: 61rem; }
  form.admin-form label { font-weight: 700; display: flex; flex-direction: column; gap: 0.35rem; }
  form.admin-form input[type=text], form.admin-form textarea {
    font: inherit; padding: 0.5rem; border: 1px solid var(--md-default-fg-color--lightest); border-radius: 0.2rem;
    background: var(--md-default-bg-color); color: var(--md-default-fg-color);
  }
  /* No explicit overflow-y here (a first version set `hidden`, paired with
     static/javascripts/admin-blocks.js's auto-grow, purely to avoid a momentary
     scrollbar flash while the height recalculates) -- that traded a cosmetic flash for
     a real dead end: auto-grow only resizes on the events it's actually wired to
     (typing, switching a block into edit mode, page load), and `overflow-y: hidden`
     left no fallback at all for any case it doesn't perfectly cover (paste, browser
     autofill, arrow-key cursor movement past the visible area) -- reported live as "I
     can no longer scroll within an edit segment." Leaving overflow-y at the browser's
     own default keeps native scrolling as an always-available safety net; auto-grow
     still does the resizing in the common case, it just isn't the only way to reach
     content anymore. resize: vertical still lets you drag it taller than its content
     needs on desktop (iOS Safari has never implemented that drag handle at all --
     auto-grow is what makes a block's textarea usable on a touchscreen in the first
     place). */
  form.admin-form textarea {
    min-height: 3rem; font-family: var(--md-code-font); font-size: 0.85rem;
    resize: vertical;
  }
  /* Edit/View live/Delete (admin_view.html) each auto-size to their own text against
     Material's fixed .md-button padding (.625em 2em) -- "Edit" and "Delete" end up
     visibly narrower than "View live" with nothing to normalize them, reported live as
     "the UI is a bit off." Two earlier attempts before this one:
       1. A shared min-width -- only a floor, and "View live"'s own natural width landed
          close enough to the chosen number that it could still come out slightly wider.
       2. flex: 1 on every direct child of .admin-actions, so Delete's <form> (not its
          <button> -- the form is the actual direct child) would grow to an equal share,
          plus width: 100% to make the real button fill that share. Delete still came out
          *smaller* than the other two: giving the form flex:1 didn't reliably force its
          block-level box to actually claim that share against its own shrink-to-fit
          content, so it settled back to roughly the width Delete's own text needed.
     display: contents on the form removes its box from layout entirely -- its <button>
     is "raised" to become a real, direct flex item of .admin-actions itself, sized by
     its own flex: 1 exactly like Edit/View live's plain <a> tags, no separate form-sizing
     step to get wrong. (The form keeps submitting normally either way -- this is a
     rendering-only property, not a DOM/behavior change.) */
  .admin-actions { display: flex; gap: 0.75rem; }
  .admin-actions form { display: contents; }
  .admin-actions .md-button { flex: 1; text-align: center; box-sizing: border-box; }
  .admin-error { color: #b3261e; font-weight: 700; }
  .admin-saved { color: var(--md-primary-fg-color); font-weight: 700; }
  /* Shown above the form (see admin_form.html) when a GET to /admin/new or
     /admin/{id}/edit found an autosaved draft newer than the last real save --
     static/javascripts/admin-autosave.js is what creates that draft in the first place,
     every couple of minutes. Matches .admin-form's own max-width so it lines up with the
     form it sits above rather than stretching full width. */
  .admin-draft-banner {
    max-width: 61rem; margin: 0 0 1rem; padding: 0.6rem 0.9rem;
    border: 1px solid var(--md-accent-fg-color); border-radius: 0.2rem;
    background: var(--md-accent-fg-color--transparent);
    font-size: 0.85rem;
  }
  .admin-draft-banner a { font-weight: 700; margin-left: 0.4rem; }
  /* A brief, self-dismissing toast (static/javascripts/admin-autosave.js toggles
     .admin-autosave-status--visible on/off around each autosave tick) rather than a
     permanent status line -- fixed position, out past the form's own 61rem column, and
     `pointer-events: none` so it can never sit on top of and intercept a click on
     anything underneath it, however it ends up positioned at any given viewport width.
     Reserves no layout space of its own either way (fixed position), so it cannot shift
     or otherwise interrupt whatever's being typed while it fades in and back out. */
  .admin-autosave-status {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 10;
    padding: 0.5rem 0.9rem; border-radius: 0.2rem;
    background: var(--md-default-bg-color); color: var(--md-default-fg-color--light);
    border: 1px solid var(--md-default-fg-color--lightest);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    font-size: 0.75rem;
    opacity: 0; transform: translateY(0.3rem);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .admin-autosave-status--visible { opacity: 1; transform: translateY(0); }
  /* Shown the instant Save is actually clicked (static/javascripts/admin-save-loader.js,
     on the form's own submit event) -- matplotlib blocks are genuinely re-executed on
     save, not just checked, and an animated one in particular can take real time
     (reported live: "sometimes the graph generation takes time"). A plain, unmodified
     native form submission still does the real work here -- this never calls
     preventDefault(), it only shows UI while the browser's own navigation to the next
     page (a redirect on success, a re-rendered form on a validation error) is already
     under way, and disappears on its own the instant that happens either way, so there
     is nothing to explicitly hide again afterward. */
  .admin-save-overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.5);
  }
  .admin-save-overlay[hidden] { display: none; }
  .admin-save-overlay__box {
    background: var(--md-default-bg-color); color: var(--md-default-fg-color);
    border-radius: 0.3rem; padding: 1.5rem 2rem; max-width: 26rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    text-align: center;
  }
  .admin-save-overlay__spinner {
    width: 2rem; height: 2rem; margin: 0 auto 1rem;
    border: 0.25rem solid var(--md-default-fg-color--lightest);
    border-top-color: var(--md-primary-fg-color);
    border-radius: 50%;
    animation: admin-save-spin 0.8s linear infinite;
  }
  @keyframes admin-save-spin { to { transform: rotate(360deg); } }
  .admin-save-overlay__title { font-weight: 700; margin: 0 0 0.75rem; }
  .admin-save-overlay__graphs {
    text-align: left; font-size: 0.85rem; margin: 0 0 0.75rem; padding-left: 1.2rem;
  }
  .admin-save-overlay__graphs[hidden] { display: none; }
  .admin-save-overlay__note { font-size: 0.75rem; color: var(--md-default-fg-color--light); margin: 0; }
  .admin-row-actions form { display: inline; }

  /* Gutenberg-style block editor (admin_form.html) -- each block of a post's markdown
     (a paragraph, an admonition, a matplotlib graph, a math block -- see render.py's
     split_into_segments) gets its own smaller textarea instead of one giant one, so a
     single problem/solution/graph can be edited without scrolling past the rest of the
     post. Reordering/adding/deleting is wired up in static/javascripts/admin-blocks.js;
     this is purely the block chrome's appearance. */
  .admin-blocks { display: flex; flex-direction: column; gap: 0.75rem; }
  .admin-block {
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 0.2rem;
    padding: 0.5rem;
    background: var(--md-code-bg-color);
  }
  .admin-block__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.4rem;
  }
  .admin-block__label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--md-default-fg-color--light);
  }
  .admin-block__controls { display: flex; gap: 0.25rem; }
  .admin-block__controls button {
    font: inherit;
    line-height: 1;
    padding: 0.15rem 0.45rem;
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 0.2rem;
    background: var(--md-default-bg-color);
    color: var(--md-default-fg-color);
    cursor: pointer;
  }
  .admin-block__controls button:hover { border-color: var(--md-primary-fg-color); color: var(--md-primary-fg-color); }
  /* Only the two zoom buttons contain an svg (magnifying-glass icons); this leaves the
     text-labeled siblings (Generate graph/Done/move arrows/delete) untouched. */
  .admin-block__controls button svg { width: 1rem; height: 1rem; display: block; fill: currentColor; }
  .admin-block textarea { width: 100%; }

  /* A second copy of the same controls below the textarea -- editing a long block (a
     multi-paragraph solution, a big matplotlib script) means the header row with Done/
     zoom/etc. can scroll out of view while typing; this puts them back within reach
     without scrolling up. Only shown in edit mode -- in view mode it'd just be a second,
     redundant copy sitting below content that's already short enough to not need it.
     static/javascripts/admin-blocks.js updates both copies' toggle text/generate-graph
     visibility together (querySelectorAll, not querySelector) since there are now two of
     each per block. */
  .admin-block__footer { margin-top: 0.4rem; }
  .admin-block[data-mode="view"] .admin-block__footer { display: none; }

  /* Each block shows either its rendered view or its raw textarea, never both -- only
     one block is ever in edit mode at once (static/javascripts/admin-blocks.js enforces
     that), so the rest of the post always reads as it will actually look, exactly what
     a Gutenberg-style block editor's edit/view toggle is for. */
  .admin-block[data-mode="view"] textarea { display: none; }
  .admin-block[data-mode="edit"] .admin-block__view { display: none; }
  .admin-block__view {
    padding: 0.4rem 0.6rem;
    cursor: text;
    min-height: 1.5rem;
  }
  .admin-block__view:empty::before {
    content: "Empty -- click to edit.";
    color: var(--md-default-fg-color--light);
    font-style: italic;
  }
  .admin-block__view :first-child { margin-top: 0; }
  .admin-block__view :last-child { margin-bottom: 0; }
  .plot-widget__pending { color: var(--md-default-fg-color--light); }
  .plot-widget__preview img { max-width: 100%; display: block; }
  /* Matches form.admin-form's own max-width above, for the same reason -- admin_view.html
     (the read-only view of a saved post) is the other admin surface that used the same
     old, narrower 700px. */
  .admin-preview {
    margin-top: 1.5rem;
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 0.2rem;
    padding: 0.5rem 1.5rem 1.5rem;
    max-width: 61rem;
  }
</style>
<div class="admin-header">
  <h1>{{ header_topic }}</h1>
  {% if show_all_posts_header_link | default(true) %}<a href="/admin/">All posts</a>{% endif %}
</div>
{% if error %}<p class="admin-error">{{ error }}</p>{% endif %}
{% block admin_content %}{% endblock %}
{% endblock %}
