{% extends "base.html" %}
{% block article %}
<style>
  .admin-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; }
  .admin-header a { font-size: 0.85rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--md-default-fg-color--lightest); }
  form.admin-form { display: flex; flex-direction: column; gap: 1rem; max-width: 700px; }
  form.admin-form label { font-weight: 700; display: flex; flex-direction: column; gap: 0.35rem; }
  form.admin-form input[type=text], form.admin-form textarea {
    font: inherit; padding: 0.5rem; border: 1px solid var(--md-default-fg-color--lightest); border-radius: 0.2rem;
    background: var(--md-default-bg-color); color: var(--md-default-fg-color);
  }
  form.admin-form textarea { min-height: 24rem; font-family: var(--md-code-font); font-size: 0.85rem; }
  .admin-actions { display: flex; gap: 0.75rem; }
  .admin-error { color: #b3261e; font-weight: 700; }
  .admin-saved { color: var(--md-primary-fg-color); font-weight: 700; }
  .admin-row-actions form { display: inline; }
  .admin-preview-heading { margin-top: 2.5rem; }
  .admin-preview {
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 0.2rem;
    padding: 0.5rem 1.5rem 1.5rem;
    max-width: 700px;
  }
</style>
<div class="admin-header">
  <h1>{{ header_topic }}</h1>
  <a href="/admin/">All posts</a>
</div>
{% if error %}<p class="admin-error">{{ error }}</p>{% endif %}
{% block admin_content %}{% endblock %}
{% endblock %}
