{% extends "base.html" %}
{% block title %}{{ post.title }} - Math Notes{% endblock %}
{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <div class="post-meta">
    {{ post.created_at_display }}
    &middot; <a href="/blog/category/{{ post.category|lower }}/" class="tag">{{ post.category }}</a>
  </div>
  {{ post.body_html | safe }}
</article>
<p><a href="/blog/">&larr; Back to Blog</a></p>
{% endblock %}
