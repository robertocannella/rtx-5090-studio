{% extends "base.html" %}
{% block content_wrapper %}
<div class="md-content md-content--post" data-md-component="content">
  <div class="md-sidebar md-sidebar--post" data-md-component="sidebar" data-md-type="navigation">
    <div class="md-sidebar__scrollwrap">
      <div class="md-sidebar__inner md-post">
        <nav class="md-nav md-nav--primary">
          <div class="md-post__back">
            <div class="md-nav__title md-nav__container">
              <a href="/blog/" class="md-nav__link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 11v2H8l5.5 5.5-1.42 1.42L4.16 12l7.92-7.92L13.5 5.5 8 11z"/></svg>
                <span class="md-ellipsis">Back to index</span>
              </a>
            </div>
          </div>
          <ul class="md-post__meta md-nav__list">
            <li class="md-nav__item md-nav__item--section">
              <div class="md-post__title"><span class="md-ellipsis">Metadata</span></div>
              <nav class="md-nav">
                <ul class="md-nav__list">
                  <li class="md-nav__item">
                    <div class="md-nav__link">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 19H5V8h14m-3-7v2H8V1H6v2H5c-1.11 0-2 .89-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1m-1 11h-5v5h5z"/></svg>
                      <time class="md-ellipsis">{{ post.created_at_display }}</time>
                    </div>
                  </li>
                  <li class="md-nav__item">
                    <div class="md-nav__link">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 3v15h3V3zm3 2 4 13 3-1-4-13zM5 5v13h3V5zM3 19v2h18v-2z"/></svg>
                      <span class="md-ellipsis">in <a href="/blog/category/{{ post.category | lower }}/">{{ post.category }}</a></span>
                    </div>
                  </li>
                  <li class="md-nav__item">
                    <div class="md-nav__link">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 20a8 8 0 0 0 8-8 8 8 0 0 0-8-8 8 8 0 0 0-8 8 8 8 0 0 0 8 8m0-18a10 10 0 0 1 10 10 10 10 0 0 1-10 10C6.47 22 2 17.5 2 12A10 10 0 0 1 12 2m.5 5v5.25l4.5 2.67-.75 1.23L11 13V7z"/></svg>
                      <span class="md-ellipsis">{{ post.reading_minutes }} min read</span>
                    </div>
                  </li>
                  <li class="md-nav__item">
                    <a href="/admin/{{ post.id }}/edit" class="md-nav__link">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.71 7.04c.39-.39.39-1.04 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.84 1.83 3.75 3.75 1.84-1.83M3 17.25V21h3.75L17.81 9.93l-3.75-3.75z"/></svg>
                      <span class="md-ellipsis">Edit post</span>
                    </a>
                  </li>
                </ul>
              </nav>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
  <article class="md-content__inner md-typeset" id="content">
    <h1>{{ post.title }}</h1>
    <h2>{{ post.id }}</h2>
    {{ post.body_html | safe }}
  </article>
</div>
{% endblock %}
