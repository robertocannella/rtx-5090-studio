<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Math Notes{% endblock %}</title>
<meta name="description" content="Math notes, derivations, and worked word problems, with real LaTeX.">
<link rel="alternate" type="application/rss+xml" title="Math Notes" href="/feed.xml">
<link rel="stylesheet" href="/static/stylesheets/site.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="site-title">Math Notes</a>
    <nav class="site-nav">
      <a href="/"{% if active_nav == "home" %} class="active"{% endif %}>Home</a>
      <a href="/blog/"{% if active_nav == "blog" %} class="active"{% endif %}>Blog</a>
      <a href="/latex-guide/"{% if active_nav == "latex-guide" %} class="active"{% endif %}>LaTeX Guide</a>
    </nav>
  </div>
</header>

<main class="site-main">
  {% block content %}{% endblock %}
</main>

{% if categories %}
<aside class="categories-panel">
  <button type="button" class="categories-panel__toggle" aria-expanded="false" aria-controls="categories-panel__body">Categories</button>
  <div class="categories-panel__body" id="categories-panel__body" hidden>
    <p class="categories-panel__title">Categories</p>
    <ul class="categories-panel__list">
      {% for cat in categories %}
      <li><a href="/blog/category/{{ cat|lower }}/">{{ cat }}</a></li>
      {% endfor %}
    </ul>
  </div>
</aside>
{% endif %}

<footer class="site-footer">
  <p>Math Notes -- personal notes, derivations, and worked word problems.</p>
</footer>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script defer src="/static/javascripts/katex.js"></script>
<script defer src="/static/javascripts/categories-panel.js"></script>
<script defer src="/static/javascripts/plot-modal.js"></script>
</body>
</html>
